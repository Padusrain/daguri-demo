<div class="modal-back" id="modalBack"><div class="modal"><div class="modalhead"><h3 id="modalTitle">新建事项</h3><button class="close" id="closeModal">×</button></div><form id="taskForm"><input type="hidden" id="editId"><div class="field"><label>事项名称</label><input id="taskName" placeholder="比如：读几页书" required></div><div class="formrow"><div class="field"><label>开始时间</label><input id="taskStart" type="time" value="09:00"></div><div class="field"><label>结束时间</label><input id="taskEnd" type="time" value="10:00"></div></div><div class="field"><label>选一个喜欢的颜色</label><div class="colors" id="colors"></div></div><div class="field"><label>今天的笔记</label><textarea id="taskNote" placeholder="完成后，记下这一刻……"></textarea></div><div class="field"><label>留一张照片</label><label class="upload" for="photoInput" id="uploadLabel">＋ 选择图片（保存在本机浏览器）</label><input id="photoInput" type="file" accept="image/*" style="display:none"></div><div class="field"><label><input id="repeatTask" type="checkbox" style="width:auto;vertical-align:middle"> 保存为常用事项，之后每天都可以添加</label></div><div class="modalfoot"><button class="delete" id="deleteTask" type="button">删除事项</button><button class="primary" type="submit">保存事项</button></div></form></div></div>
<script>
const palette=['#7ca27e','#df9274','#7ea8c4','#b18bb9','#e2b85f','#6e8eb4','#dd817f','#84988b'];
const today=new Date(2026,10,9); let shown=new Date(today),selected=new Date(today),view='day',photoData='';
const initialTasks=[{id:'t1',name:'晨间阅读',start:'08:10',end:'09:00',color:palette[2],done:true,completedAt:'09:02',note:'读完了新买的散文集，窗边的光刚刚好。',photo:'',day:'2026-11-09'},{id:'t2',name:'整理本周计划',start:'09:30',end:'10:15',color:palette[0],done:true,completedAt:'10:21',note:'把要紧的事情理顺了。',photo:'',day:'2026-11-09'},{id:'t3',name:'项目设计',start:'10:40',end:'12:00',color:palette[3],done:false,note:'',photo:'',day:'2026-11-09'},{id:'t4',name:'午后散步',start:'14:00',end:'14:35',color:palette[1],done:false,note:'',photo:'',day:'2026-11-09'},{id:'t5',name:'练习画画',start:'19:00',end:'20:00',color:palette[4],done:false,note:'',photo:'',day:'2026-11-09'}];
function read(key,fallback){try{return JSON.parse(localStorage.getItem('daguri-'+key))??fallback}catch{return fallback}}
let tasks=read('tasks',initialTasks),templates=read('templates',[]),extraTodos=read('todos',[]),habits=read('habits',[{id:'h1',name:'喝水',color:'#68a5d4',counts:{'2026-11-09':3}},{id:'h2',name:'伸展一下',color:'#e8a17b',counts:{'2026-11-09':1}},{id:'h3',name:'维生素',color:'#ab8bc5',counts:{}}]);
const $=s=>document.querySelector(s),fmt=d=>`${d.getMonth()+1}月${d.getDate()}日`,dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function save(){for(const [k,v] of Object.entries({tasks,templates,todos:extraTodos,habits}))try{localStorage.setItem('daguri-'+k,JSON.stringify(v))}catch{}}
function dayTasks(d=selected){return tasks.filter(t=>t.day===dayKey(d))}
function renderCal(){ $('#monthTitle').textContent=`${shown.getFullYear()}年${shown.getMonth()+1}月`;let first=new Date(shown.getFullYear(),shown.getMonth(),1),start=(first.getDay()+6)%7,count=new Date(shown.getFullYear(),shown.getMonth()+1,0).getDate(),prevCount=new Date(shown.getFullYear(),shown.getMonth(),0).getDate(),html='';for(let i=0;i<42;i++){let d,dim=false;if(i<start){d=new Date(shown.getFullYear(),shown.getMonth()-1,prevCount-start+i+1);dim=true}else if(i>=start+count){d=new Date(shown.getFullYear(),shown.getMonth()+1,i-start-count+1);dim=true}else d=new Date(shown.getFullYear(),shown.getMonth(),i-start+1);let iso=dayKey(d),ist=iso===dayKey(today),sel=iso===dayKey(selected),has=tasks.some(t=>t.day===iso)||habits.some(h=>(h.counts?.[iso]||0)>0);html+=`<div class="day ${dim?'dim':''} ${ist?'today':''} ${sel?'selected':''} ${has?'has':''}" data-date="${iso}">${d.getDate()}</div>`}$('#calendar').innerHTML=html;document.querySelectorAll('.day').forEach(el=>el.onclick=()=>{selected=new Date(el.dataset.date+'T12:00:00');if(view==='week')renderWeek();renderAll()})}
function duration(a,b){let n=Math.max(0,mins(b)-mins(a));return `${Math.floor(n/60)?Math.floor(n/60)+'小时':''}${n%60?n%60+'分':''}`||'0分'}function mins(t){let[h,m]=t.split(':').map(Number);return h*60+m}
function renderDay(){let list=dayTasks().sort((a,b)=>mins(a.start)-mins(b.start)),board=document.createElement('div');board.className='daily-board';board.style.setProperty('--lanes',Math.max(1,list.length));let rail=document.createElement('div');rail.className='time-rail';rail.innerHTML=Array.from({length:16},(_,i)=>`<span>${String(i+7).padStart(2,'0')}:00</span>`).join('');board.append(rail);if(!list.length){let empty=document.createElement('div');empty.className='empty';empty.style.padding='30px';empty.textContent='这一天还没有安排，添加一件事项吧。';board.append(empty)}list.forEach(t=>{let lane=document.createElement('div');lane.className='task-lane';let title=document.createElement('div');title.className='lane-title';title.innerHTML=`<i style="background:${t.color}"></i>${t.name}`;lane.append(title);let ev=document.createElement('div'),top=Math.max(0,(mins(t.start)-420)/960*528),height=Math.max(39,(mins(t.end)-mins(t.start))/960*528);ev.className='lane-event '+(t.done?'done':'');ev.style=`top:${38+top}px;height:${height}px;background:${t.color}`;ev.innerHTML=`<b>${t.done?'✓ ':''}${t.name}</b><small>${t.start}—${t.end}<br>${duration(t.start,t.end)}${t.done&&t.completedAt?' · '+t.completedAt+' 完成':''}</small>`;ev.onclick=()=>openModal(t.id);lane.append(ev);board.append(lane)});$('#timeline').replaceWith(board);board.id='timeline';$('.nowline')?.remove();$('#hours').style.display='none';$('#axisLabel').textContent='时间 ↓';$('#axisFoot').textContent='横向为事项，纵向为时间（07:00—23:00）';}
function startWeek(d){let x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function renderWeek(){let monday=startWeek(selected),labels=['周一','周二','周三','周四','周五','周六','周日'],grid=document.createElement('div');grid.className='weekgrid';for(let i=0;i<7;i++){let d=new Date(monday);d.setDate(d.getDate()+i);let iso=dayKey(d),col=document.createElement('div');col.className='weekday';col.innerHTML=`<div class="weekdate ${iso===dayKey(today)?'today':''}">${labels[i]}<b>${d.getMonth()+1}/${d.getDate()}</b></div>`;tasks.filter(t=>t.day===iso).sort((a,b)=>mins(a.start)-mins(b.start)).forEach(t=>{let chip=document.createElement('div');chip.className='weekchip';chip.style.background=t.color;chip.innerHTML=`${t.done?'✓ ':''}${t.name}<small>${t.start}—${t.end}</small>`;chip.onclick=()=>openModal(t.id);col.append(chip)});let dailyHabits=habits.filter(h=>(h.counts?.[iso]||0)>0);if(dailyHabits.length){let dots=document.createElement('div');dots.className='weekchip';dots.style='background:#eef3f6;color:#557a92';dots.textContent=dailyHabits.map(h=>`${h.name} ${h.counts[iso]}次`).join(' · ');col.append(dots)}col.onclick=e=>{if(e.target===col||e.target.closest('.weekdate')){selected=new Date(iso+'T12:00:00');renderAll()}};grid.append(col)}$('#timeline').replaceWith(grid);grid.id='timeline';$('.nowline')?.remove();$('#axisLabel').textContent='一周';$('#axisFoot').textContent='点击事项可编辑；点击日期可切换到对应日期';$('#hours').style.display='none'}
function renderTodos(){let list=dayTasks(),html=list.map(t=>`<div class="todo ${t.done?'checked':''}" data-id="${t.id}"><button class="tick" title="完成">${t.done?'✓':''}</button><div class="todo-copy"><div class="todo-title">${t.name}</div><div class="todo-meta">${t.start}—${t.end}${t.done&&t.completedAt?' · '+t.completedAt+' 完成':''}${t.note?' · 有笔记':''}${t.photo?' · 📷':''}</div></div><div class="todo-actions"><button class="tiny-action edit-task" title="编辑">✎</button><button class="tiny-action delete-task" title="删除">×</button></div><span class="todo-color" style="background:${t.color}"></span></div>`).join('')+extraTodos.filter(t=>t.day===dayKey(selected)).map(t=>`<div class="todo ${t.done?'checked':''}" data-extra="${t.id}"><button class="tick">${t.done?'✓':''}</button><div class="todo-copy"><div class="todo-title">${t.name}</div><div class="todo-meta">今天的待办</div></div><div class="todo-actions"><button class="tiny-action edit-extra" title="编辑">✎</button><button class="tiny-action delete-extra" title="删除">×</button></div><span class="todo-color" style="background:#c8d9b8"></span></div>`).join('');$('#todos').innerHTML=html||'<div class="empty">这一天还没有事项。</div>';document.querySelectorAll('.todo').forEach(el=>{el.querySelector('.tick').onclick=()=>{if(el.dataset.id){let t=tasks.find(x=>x.id===el.dataset.id);t.done=!t.done;t.completedAt=t.done?new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'';if(t.done)toast('已记下完成时间')}else{let t=extraTodos.find(x=>x.id===el.dataset.extra);t.done=!t.done}save();renderAll()};el.querySelector('.edit-task')?.addEventListener('click',()=>openModal(el.dataset.id));el.querySelector('.delete-task')?.addEventListener('click',()=>deleteTask(el.dataset.id));el.querySelector('.edit-extra')?.addEventListener('click',()=>{let t=extraTodos.find(x=>x.id===el.dataset.extra),n=prompt('编辑待办名称',t.name);if(n?.trim()){t.name=n.trim();save();renderAll()}});el.querySelector('.delete-extra')?.addEventListener('click',()=>{extraTodos=extraTodos.filter(x=>x.id!==el.dataset.extra);save();renderAll()})});let done=list.filter(t=>t.done).length+extraTodos.filter(t=>t.day===dayKey(selected)&&t.done).length,total=list.length+extraTodos.filter(t=>t.day===dayKey(selected)).length;$('#doneCount').textContent=done;$('#progressLabel').textContent=`已完成 ${done} / ${total} 件`;$('#progressBar').style.width=(total?done/total*100:0)+'%';$('#todoHint').textContent=total-done?`还有 ${total-done} 件待完成`:'清单已完成';let totalMin=list.filter(t=>t.done).reduce((s,t)=>s+mins(t.end)-mins(t.start),0);$('#focusTime').textContent=`${Math.floor(totalMin/60)}h ${totalMin%60}m`;}
function renderHabits(){let iso=dayKey(selected);$('#habits').innerHTML=habits.map((h,i)=>{let count=h.counts?.[iso]||0;return `<div class="habit"><div class="habitname"><i style="background:${h.color}"></i>${h.name}</div><div class="habit-actions"><button class="tiny-action edit-habit" data-i="${i}" title="编辑习惯">✎</button><button class="tiny-action delete-habit" data-i="${i}" title="删除习惯">×</button></div><div class="habitdots">${Array.from({length:8},(_,j)=>`<button class="${j<count?'on':''}" data-h="${i}" data-n="${j}" title="记录第 ${j+1} 次"></button>`).join('')}<span>${count} 次 · 点击圆点记录</span></div></div>`}).join('')||'<div class="empty">还没有习惯，添加一个吧。</div>';document.querySelectorAll('.habitdots button').forEach(b=>b.onclick=()=>{let h=habits[+b.dataset.h],k=dayKey(selected),n=+b.dataset.n;h.counts=h.counts||{};h.counts[k]=n<(h.counts[k]||0)?n:n+1;save();renderHabits();renderCal()});document.querySelectorAll('.edit-habit').forEach(b=>b.onclick=()=>{let h=habits[+b.dataset.i],n=prompt('编辑习惯名称',h.name);if(n?.trim()){h.name=n.trim();save();renderAll()}});document.querySelectorAll('.delete-habit').forEach(b=>b.onclick=()=>{let h=habits[+b.dataset.i];if(confirm(`删除习惯“${h.name}”？`)){habits.splice(+b.dataset.i,1);save();renderAll()}})}
function renderQuick(){$('#quick').innerHTML=templates.map((t,i)=>`<div class="quickitem" data-i="${i}"><i class="swatch" style="background:${t.color}"></i>${t.name}<span>＋</span></div>`).join('')||'<div class="empty">保存事项后可加入常用</div>';document.querySelectorAll('.quickitem').forEach(q=>q.onclick=()=>{let t=templates[+q.dataset.i],copy={...t,id:'t'+Date.now(),day:dayKey(selected),done:false,completedAt:'',note:'',photo:''};tasks.push(copy);save();renderAll();toast('已加入当天事项')})}
function renderAll(){renderCal();let wd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][selected.getDay()];$('#dateTitle').textContent=`${fmt(selected)} · ${wd}`;$('#timeline').id='timeline';if(view==='day')renderDay();else renderWeek();renderTodos();renderHabits();renderQuick()}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
function openModal(id=null){let t=tasks.find(x=>x.id===id);$('#modalTitle').textContent=t?'编辑事项':'新建事项';$('#editId').value=id||'';$('#taskName').value=t?.name||'';$('#taskStart').value=t?.start||'09:00';$('#taskEnd').value=t?.end||'10:00';$('#taskNote').value=t?.note||'';$('#repeatTask').checked=false;photoData=t?.photo||'';$('#uploadLabel').textContent=photoData?'✓ 已选择图片（点击更换）':'＋ 选择图片';$('#deleteTask').style.display=t?'block':'none';$('#colors').innerHTML=palette.map(c=>`<button type="button" data-color="${c}" class="${(t?.color||palette[0])===c?'sel':''}" style="background:${c}"></button>`).join('');document.querySelectorAll('.colors button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.colors button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});$('#modalBack').classList.add('open')}
function closeModal(){$('#modalBack').classList.remove('open')}
function deleteTask(id){let t=tasks.find(x=>x.id===id);if(t&&confirm(`删除事项“${t.name}”？`)){tasks=tasks.filter(x=>x.id!==id);save();renderAll()}}
$('#newTask').onclick=()=>openModal();$('#addTodo').onclick=()=>{let n=prompt('今天要做什么？');if(n?.trim()){extraTodos.push({id:'x'+Date.now(),name:n.trim(),done:false,day:dayKey(selected)});save();renderAll()}};$('#addHabit').onclick=()=>{let n=prompt('要记录什么习惯？');if(n?.trim()){habits.push({id:'h'+Date.now(),name:n.trim(),color:palette[habits.length%palette.length],counts:{}});save();renderAll()}};$('#addTemplate').onclick=()=>{openModal();$('#repeatTask').checked=true};$('#taskForm').onsubmit=e=>{e.preventDefault();let id=$('#editId').value,entry={id:id||'t'+Date.now(),name:$('#taskName').value.trim(),start:$('#taskStart').value,end:$('#taskEnd').value,color:$('.colors button.sel')?.dataset.color||palette[0],done:tasks.find(x=>x.id===id)?.done||false,completedAt:tasks.find(x=>x.id===id)?.completedAt||'',note:$('#taskNote').value,photo:photoData,day:tasks.find(x=>x.id===id)?.day||dayKey(selected)};if(id)tasks[tasks.findIndex(x=>x.id===id)]=entry;else tasks.push(entry);if($('#repeatTask').checked&&!templates.some(t=>t.name===entry.name))templates.push({name:entry.name,start:entry.start,end:entry.end,color:entry.color});save();closeModal();renderAll();toast('事项已保存')};$('#photoInput').onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader();r.onload=()=>{photoData=r.result;$('#uploadLabel').textContent='✓ 已选择图片'};r.readAsDataURL(f)}};$('#closeModal').onclick=closeModal;$('#modalBack').onclick=e=>{if(e.target===$('#modalBack'))closeModal()};$('#deleteTask').onclick=()=>deleteTask($('#editId').value);$('#prevMonth').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()-1,1);renderCal()};$('#nextMonth').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()+1,1);renderCal()};$('#todayBtn').onclick=()=>{shown=new Date(today);selected=new Date(today);renderAll()};$('#weekView').onclick=()=>{view='week';$('#weekView').classList.add('active');document.querySelector('.view-toggle button:first-child').classList.remove('active');renderAll()};document.querySelector('.view-toggle button:first-child').onclick=()=>{view='day';$('#weekView').classList.remove('active');document.querySelector('.view-toggle button:first-child').classList.add('active');renderAll()};$('#figure').onclick=()=>{$('#shell').classList.toggle('collapsed')};$('#exportData').onclick=()=>{let blob=new Blob([JSON.stringify({tasks,templates,habits,todos:extraTodos},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='大菇日-备份-'+dayKey(new Date())+'.json';a.click();URL.revokeObjectURL(a.href)};$('#importData').onclick=()=>$('#backupInput').click();$('#backupInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.tasks)||!Array.isArray(d.habits))throw Error();tasks=d.tasks;habits=d.habits;templates=Array.isArray(d.templates)?d.templates:[];extraTodos=Array.isArray(d.todos)?d.todos:[];save();renderAll();toast('备份已恢复')}catch{toast('备份文件无法读取')}};r.readAsText(f);e.target.value=''};
renderAll();
</script></body></html>
